      /*  if(guess===result){
            console.log(`you Win, your chooice is ${result}`);
        }else{
             console.log(`you Lose, your chooice is ${result}`);
        }
        */
    const gameResult=(guess===result) ? `You Win , your choose for ${result}`: `You Lose , your choose for ${result}`;
    console.log(gameResult);

    ">Coin Flip</button>
