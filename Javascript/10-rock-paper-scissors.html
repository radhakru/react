<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock , Paper , Scissor</title>

    <link rel="stylesheet" href="css/10-rock-paper-scissors.css">
       

    


  </head>
   <p class="title">Rock paper Scissior</p>
            <button onClick="playGame('rock');"  class="move-button"> 
                <img src="projectimages/rock-emoji.png" class="move-icon">
            </button>

            <button onClick="playGame('paper');" class="move-button">
                <img src="projectimages/paper-emoji.png" class="move-icon">
            </button>
           
            <button onClick="playGame('scissors');" class="move-button">
                <img src="projectimages/scissors-emoji.png" class="move-icon">
            </button>
            
            <p class="js-result result"></p>
            <p class="js-moves"></p>
            <p class="js-score score"></p>
           



            <button onCLick="
                score.Wins=0;
                score.Loss=0;
                score.Tie=0;
                localStorage.removeItem('score');
                updateScore();" 
            class="reset-score-button">
            Reset Score
        </button>
            
        <script src="js/10-rock-paper-scissors.js"></script>

</body>
</html>
