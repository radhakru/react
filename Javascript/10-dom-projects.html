<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom Projects</title>
    <style>
      body {
        font-family: Arial;
      }

      .subscribe-button {
        border: none;
        background-color: black;
        color: white;
        padding: 10px 20px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        margin-bottom: 20px;
      }
      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

      .cost-input {
        padding: 10px;
        font-size: 16px;
      }
      .calculate-btn {
        background-color: green;
        color: white;
        padding: 10px;
        font-size: 16px;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button onClick="function1();" class="js-subscribe subscribe-button">
      Subscribe
    </button>
    <p>Amazon Shopping Calculator</p>
    <input
      placeholder="Cost of order"
      class="cost-input"
      onkeydown="handleonKeydown(event)"
    />
    <button onclick="calculate();" class="calculate-btn">Calculate</button>
    <p class="js-cost"></p>
    <script>
      //create one function to use it
      //convert Number to string
      String(23);
      console.log(typeof String(23));
      //console.log("10" - 5);//mistake

      //window is build in object that represent the browser , we do not need to call it directly
      window.document;
      window.console.log("window");
      // window.alert("hello world");

      function handleonKeydown(event) {
        if (event.key === "Enter") {
          calculate();
        }
      }

      function function1() {
        const btnValue = document.querySelector(".js-subscribe");
        if (btnValue.innerText === "Subscribe") {
          btnValue.innerHTML = "Subscribed";
          btnValue.classList.add("is-subscribed");
          console.log("value of btn=" + btnValue.classList);
        } else {
          btnValue.innerHTML = "Subscribe";
          btnValue.classList.remove("is-subscribed");
          console.log("value of btn=" + btnValue.classList);
        }
      }

      function calculate() {
        const input = document.querySelector("input");
        let cost = Number(input.value); //type coercion
        console.log(typeof cost);

        if (cost < 40) {
          cost += 10;
        }
        document.querySelector(".js-cost").innerHTML = `$${cost}`;
      }
    </script>
  </body>
</html>
